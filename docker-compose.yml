# Local development database. Production uses Neon (managed PostgreSQL).
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: nozl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    volumes:
      - nozl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nozl-pgdata:
